<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NBA Líneas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏀</text></svg>">
<title>NBA Líneas</title>
<style>
:root{
  --bg:#0f1420; --card:#171e2e; --card2:#1d2639; --line:#2a3550;
  --txt:#e8ecf5; --mut:#8d98b3; --acc:#ff7a1a; --ok:#22c55e; --bad:#ef4444;
  --okbg:rgba(34,197,94,.16); --badbg:rgba(239,68,68,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
body{padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 84px)}
h1{font-size:20px;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
input,select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.row{display:grid;gap:10px;margin-bottom:10px}
.r2{grid-template-columns:1fr 1fr}
.r3{grid-template-columns:1fr 1fr 1fr}
.r4{grid-template-columns:repeat(4,1fr)}
.sec{font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
button.go{width:100%;background:var(--acc);color:#1a0d00;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:6px}
button.go:disabled{opacity:.6}
.msg{padding:12px;border-radius:10px;font-size:14px;margin-bottom:12px}
.err{background:var(--badbg);border:1px solid var(--bad);color:#ffb4b4}
.info{background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:14px}
.head h2{margin:0;font-size:18px}
.head p{margin:3px 0 0;color:var(--mut);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0b101b;border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);z-index:10}
.tab{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab span.i{font-size:18px}
.tab.on{color:var(--acc);background:rgba(255,122,26,.1)}
.pane{display:none}.pane.on{display:block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--card2);color:var(--mut);font-size:11px;text-transform:uppercase;position:sticky;top:0}
td.l,th.l{text-align:left}
tr:last-child td{border-bottom:0}
td.ok{background:var(--okbg);color:var(--ok);font-weight:700}
td.no{background:var(--badbg);color:var(--bad);font-weight:700}
td.sticky,th.sticky{position:sticky;left:0;background:var(--card);z-index:1}
th.sticky{background:var(--card2)}
.metric{margin-bottom:14px}
.metric .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.metric .t b{font-size:16px}
.metric .t small{color:var(--mut)}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.pct{font-size:22px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px}
.stat .k{color:var(--mut);font-size:12px;text-transform:uppercase}
.stat .v{font-size:26px;font-weight:800;margin:2px 0}
.stat .s{color:var(--mut);font-size:12px}
.split h3{margin:0 0 4px;font-size:16px}
.split .n{color:var(--mut);font-size:13px;margin-bottom:10px}
.top{display:flex;gap:12px;align-items:flex-start}
.medal{font-size:28px;line-height:1}
.top .d{flex:1}
.top .d b{font-size:15px}
.top .d .sub{color:var(--mut);font-size:12px;margin:2px 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--card2);border-radius:8px;padding:5px 9px;font-size:13px}
.pill.hl{background:var(--acc);color:#1a0d00;font-weight:800}
.seg{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.seg button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 14px;font-size:14px}
.seg button.on{background:var(--acc);color:#1a0d00;border-color:var(--acc);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #1a0d00;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:8px}

:root{color-scheme:dark}
.toptabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;background:var(--bg);padding:6px 0 10px}
.toptab{flex:1;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:12px;padding:11px 6px;font-size:14px;font-weight:700}
.toptab.on{background:var(--acc);color:#1a0d00;border-color:var(--acc)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--acc)}
.hero{background:linear-gradient(160deg,#1f2a44,#171e2e)}
.hero .hn{font-size:20px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:var(--card2);border-radius:8px;padding:4px 9px;font-size:12px}.tag.a{background:var(--acc);color:#1a0d00;font-weight:800}
.big{font-size:44px;font-weight:900;color:var(--acc);line-height:1}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.leg{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .stat .v{font-size:28px}
.trk{position:relative;height:10px;background:var(--card2);border-radius:99px;margin:5px 0 8px}
.fil{display:block;height:100%;border-radius:99px}
.ref{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;opacity:.8}
.lv{display:flex;justify-content:space-between;font-size:13px}.lv span{color:var(--mut)}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.seg4>div{background:var(--card2);border:2px solid transparent;border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;color:var(--mut)}
.seg4>div.on{border-color:var(--acc);color:var(--txt);background:rgba(255,122,26,.14)}
.seg4 b{display:block;font-size:14px;color:var(--txt)}
.ring{display:flex;align-items:center;gap:14px}
</style>
</head>
<body>

<h1>🏀 NBA Líneas</h1>
<div class="toptabs"><button class="toptab on" data-v="l">📋 Líneas</button><button class="toptab" data-v="e">⚡ Eficiencia jugador</button></div>
<div id="viewLineas">

<!-- ========== FORMULARIO ========== -->
<div class="card" id="formCard">
  <div class="row">
    <div>
      <label for="jugador">Jugador</label>
      <input id="jugador" list="plist" placeholder="Ej: Luka Doncic" autocomplete="off" autocapitalize="words" autocorrect="off">
      <datalist id="plist"></datalist>
    </div>
  </div>
  <div class="row r3">
    <div>
      <label for="temp">Temporada</label>
      <input id="temp" type="number" inputmode="numeric" placeholder="2026">
    </div>
    <div>
      <label for="npart">Nº partidos</label>
      <input id="npart" type="number" inputmode="numeric" placeholder="20">
    </div>
    <div>
      <label for="filtro">Local / Visita</label>
      <select id="filtro">
        <option value="ambos">Ambos</option>
        <option value="L">Local (L)</option>
        <option value="V">Visita (V)</option>
      </select>
    </div>
  </div>
  <div class="sec">Líneas (≥) — deja vacío para no evaluar</div>
  <div class="row r4">
    <div><label for="lpts">PTS</label><input id="lpts" type="number" inputmode="decimal" step="0.5"></div>
    <div><label for="lreb">REB</label><input id="lreb" type="number" inputmode="decimal" step="0.5"></div>
    <div><label for="last">AST</label><input id="last" type="number" inputmode="decimal" step="0.5"></div>
    <div><label for="l3pm">3PM</label><input id="l3pm" type="number" inputmode="decimal" step="0.5"></div>
  </div>
  <button class="go" id="btn">Analizar</button>
  <div class="foot" id="tempHelp"></div>
  <details style="margin-top:10px" id="cfg">
    <summary style="color:var(--mut);font-size:13px;cursor:pointer">⚙️ Conexión (Worker)</summary>
    <div style="margin-top:8px">
      <label for="wurl">URL de tu Worker de Cloudflare</label>
      <input id="wurl" type="url" placeholder="https://nba-proxy.tuusuario.workers.dev" autocapitalize="off" autocorrect="off">
      <div class="foot" style="text-align:left">Se guarda solo en este dispositivo.</div>
    </div>
  </details>
  <div class="foot">v4</div>
</div>

<div id="status"></div>

<!-- ========== RESULTADOS ========== -->
<div id="results" class="hidden">
  <div class="card head" id="head"></div>

  <div class="pane on" id="p1">
    <div class="sec" style="margin-top:0">Tabla de partidos y evaluación de líneas</div>
    <div class="scroll" id="tabla"></div>
  </div>

  <div class="pane" id="p2">
    <div class="card" id="cumpl"></div>
  </div>

  <div class="pane" id="p3">
    <div class="grid2" id="prom"></div>
  </div>

  <div class="pane" id="p4">
    <div id="splits"></div>
  </div>

  <div class="pane" id="p5">
    <div class="seg" id="seg"></div>
    <div id="top3"></div>
  </div>
</div>

<nav class="tabs hidden" id="tabs">
  <button class="tab on" data-t="p1"><span class="i">📋</span>Partidos</button>
  <button class="tab" data-t="p2"><span class="i">🎯</span>Líneas</button>
  <button class="tab" data-t="p3"><span class="i">📊</span>Promedios</button>
  <button class="tab" data-t="p4"><span class="i">🏠</span>L / V</button>
  <button class="tab" data-t="p5"><span class="i">🏆</span>Top 3</button>
</nav>
</div>
<div id="viewEff" class="hidden">
 <div class="card">
  <div class="row"><div><label for="ejug">Jugador</label><input id="ejug" list="plist" placeholder="Ej: Shai Gilgeous-Alexander" autocomplete="off" autocapitalize="words" autocorrect="off"></div></div>
  <div class="row r2">
   <div><label for="eteam">Equipo del jugador</label><select id="eteam"></select></div>
   <div><label for="erival">Rival</label><select id="erival"></select></div>
  </div>
  <div class="row r2">
   <div><label for="econd">Juega de</label><select id="econd"><option value="LOCAL">Local</option><option value="VISITANTE">Visita</option><option value="TODOS">Todos</option></select></div>
   <div><label for="etemp">Temporada</label><input id="etemp" type="number" inputmode="numeric"></div>
  </div>
  <div class="row"><div><label for="efecha">Fecha del próximo partido</label><input id="efecha" type="date"></div></div>
  <label for="emin">Minutos proyectados: <b id="eminv" style="color:var(--acc)">25</b></label>
  <input id="emin" type="range" min="15" max="42" step="1" value="25">
  <button class="go" id="ebtn">Calcular eficiencia</button>
  <div class="foot" id="etempHelp"></div>
 </div>
 <div id="effStatus"></div>
 <div id="effOut"></div>
</div>

<script>
/* ============================================================
   LÓGICA (equivalente al Colab)
   ============================================================ */
const BASE = "https://site.api.espn.com/apis/site/v2/sports/basketball/nba";
const GAMELOG = "https://site.web.api.espn.com/apis/common/v3/sports/basketball/nba/athletes/";
const STATS = ["PTS", "REB", "3PM", "AST"];

// minúsculas, sin acentos (Dončić → doncic), sin ' ’ .
function normalize(s) {
  return String(s || "").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['’.]/g, "").replace(/\s+/g, " ").trim();
}

// Rutas de conexión: tu Worker propio (si lo configuras) → directa → proxies públicos
let MODO = 0;
function workerURL() { try { return (localStorage.getItem("nba_worker") || "").trim().replace(/\/+$/, ""); } catch (e) { return ""; } }
function armarRutas() {
  const r = [];
  const w = workerURL();
  if (w) r.push({ n: "Tu Worker (Cloudflare)", f: u => w + "/?url=" + encodeURIComponent(u) });
  r.push({ n: "Directa a ESPN", f: u => u });
  r.push({ n: "Proxy corsproxy.io", f: u => "https://corsproxy.io/?url=" + encodeURIComponent(u) });
  r.push({ n: "Proxy allorigins", f: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u) });
  r.push({ n: "Proxy codetabs", f: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u) });
  return r;
}
async function getJSON(url, params) {
  const u = new URL(url);
  if (params) Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const full = u.toString();
  const RUTAS = armarRutas();
  if (MODO >= RUTAS.length) MODO = 0;
  let ultimo = "";
  for (let k = 0; k < RUTAS.length; k++) {
    const i = (MODO + k) % RUTAS.length;
    try {
      const r = await fetch(RUTAS[i].f(full));
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      MODO = i;
      return j;
    } catch (e) { ultimo = String(e.message || e); }
  }
  throw new Error("Failed to fetch (" + ultimo + ")");
}

// Ejecuta tareas con un máximo de concurrencia (para no saturar los proxies)
async function enLotes(items, fn, max) {
  const out = new Array(items.length);
  let i = 0;
  await Promise.all(Array.from({ length: max }, async () => {
    while (i < items.length) { const k = i++; out[k] = await fn(items[k]); }
  }));
  return out;
}

// Índice de jugadores (todos los rosters, en paralelo) con caché de 12 h
async function cargarIndice() {
  try {
    const c = JSON.parse(localStorage.getItem("nba_idx_v2") || "null");
    if (c && Date.now() - c.t < 12 * 3600 * 1000 && c.d.length > 100) return c.d;
  } catch (e) {}
  const teams = await getJSON(BASE + "/teams");
  const lista = teams.sports[0].leagues[0].teams.map(g => ({ id: g.team.id, nombre: g.team.displayName, ab: g.team.abbreviation }));
  const rosters = await enLotes(lista, eq =>
    getJSON(BASE + "/teams/" + eq.id + "/roster").then(r => ({ eq, r })).catch(() => null), 6);
  const out = [];
  for (const x of rosters) {
    if (!x) continue;
    let at = x.r.athletes || [];
    if (at.length && at[0] && at[0].items) at = at.flatMap(g => g.items || []);
    for (const a of at) {
      const n = a.fullName || a.displayName || "";
      if (n) out.push({ id: a.id, nombre: n, equipo: x.eq.nombre, ab: x.eq.ab, pos: (a.position && (a.position.displayName || a.position.abbreviation)) || "", n: normalize(n) });
    }
  }
  if (!out.length) throw new Error("No se pudo cargar la lista de jugadores de ESPN.");
  try { localStorage.setItem("nba_idx_v2", JSON.stringify({ t: Date.now(), d: out })); } catch (e) {}
  return out;
}

function buscarCandidatos(idx, texto) {
  const t = normalize(texto);
  if (!t) return [];
  const exacto = idx.filter(p => p.n === t);
  if (exacto.length) return exacto;
  const parcial = idx.filter(p => p.n.includes(t));
  if (parcial.length) return parcial;
  const toks = t.split(" ");
  return idx.filter(p => toks.every(k => p.n.includes(k)));
}

function parseGamelog(data, temporada) {
  const labels = data.labels, seasonTypes = data.seasonTypes, meta = data.events || {};
  if (!labels || !seasonTypes) throw new Error("No hay registros de partidos para la temporada " + temporada + ".");
  const ix = {}; labels.forEach((l, i) => ix[l] = i);
  const col = (fila, n, def) => (ix[n] === undefined || ix[n] >= fila.length) ? def : fila[ix[n]];
  const num = v => { const x = parseFloat(v); return isNaN(x) ? null : x; };
  const filas = [];
  for (const st of seasonTypes) {
    const tipo = st.displayName || "Regular Season";
    for (const cat of (st.categories || [])) {
      for (const ev of (cat.events || [])) {
        const stats = ev.stats || [], m = meta[ev.eventId];
        if (!stats.length || !m) continue;
        const tres = col(stats, "3PT", "0-0");
        const tresM = (typeof tres === "string" && tres.includes("-")) ? tres.split("-")[0] : tres;
        const simbolo = m.atVs || "vs";
        filas.push({
          Fecha: (m.gameDate || "").slice(0, 10),
          Partido: (simbolo + " " + ((m.opponent || {}).abbreviation || "")).trim(),
          LV: simbolo !== "@" ? "L" : "V",
          R: m.gameResult || "",
          MIN: num(col(stats, "MIN", "0")),
          PTS: num(col(stats, "PTS", "0")),
          REB: num(col(stats, "REB", "0")),
          "3PM": num(tresM),
          AST: num(col(stats, "AST", "0")),
          Tipo: tipo
        });
      }
    }
  }
  return filas.filter(f => f.Fecha).sort((a, b) => b.Fecha.localeCompare(a.Fecha));
}

function filtrarYRecortar(filas, filtro, n) {
  let f = filas;
  if (filtro === "L" || filtro === "V") f = f.filter(x => x.LV === filtro);
  return f.slice(0, n);
}

const mean = a => { const v = a.filter(x => x !== null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const mn = a => { const v = a.filter(x => x !== null); return v.length ? Math.min(...v) : null; };
const mx = a => { const v = a.filter(x => x !== null); return v.length ? Math.max(...v) : null; };
const fmt = (x, d = 1) => x === null || x === undefined ? "–" : (Number.isInteger(x) && d === 0 ? String(x) : x.toFixed(d));

// Evaluación: cada partido recibe Cumple por línea y COMBO (todas a la vez)
function evaluar(filas, lineas) {
  const activas = STATS.filter(s => lineas[s] !== null);
  const ev = filas.map(f => {
    const c = {};
    let combo = true;
    for (const s of activas) {
      const ok = f[s] !== null && f[s] >= lineas[s];
      c[s] = ok; combo = combo && ok;
    }
    return Object.assign({}, f, { cumple: c, combo: activas.length ? combo : null });
  });
  const total = ev.length;
  const resumen = activas.map(s => {
    const veces = ev.filter(f => f.cumple[s]).length;
    return { stat: s, linea: lineas[s], veces, total, pct: total ? veces / total * 100 : 0 };
  });
  if (activas.length) {
    const veces = ev.filter(f => f.combo).length;
    resumen.push({ stat: "COMBO", linea: null, veces, total, pct: total ? veces / total * 100 : 0 });
  }
  return { ev, activas, resumen };
}

/* ============================================================
   UI
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NOMBRES = { PTS: "Puntos", REB: "Rebotes", AST: "Asistencias", "3PM": "Triples (3PM)" };
let IDX = null, ESTADO = null;

function setStatus(html, cls) { $("status").innerHTML = html ? '<div class="msg ' + (cls || "info") + '">' + html + "</div>" : ""; }
function colorPct(p) { return p >= 70 ? "var(--ok)" : p >= 50 ? "#eab308" : "var(--bad)"; }

function guardarForm() {
  try {
    localStorage.setItem("nba_form_v1", JSON.stringify({
      j: $("jugador").value, t: $("temp").value, n: $("npart").value, f: $("filtro").value,
      p: $("lpts").value, r: $("lreb").value, a: $("last").value, x: $("l3pm").value
    }));
  } catch (e) {}
}
function cargarForm() {
  try {
    const d = JSON.parse(localStorage.getItem("nba_form_v1") || "null");
    if (!d) return;

async function analizar(playerSel) {
  const nombreIn = $("jugador").value.trim();
  const temporada = parseInt($("temp").value, 10);
  const n = parseInt($("npart").value, 10);
  const filtro = $("filtro").value;
  const lineas = { PTS: leerLinea("lpts"), REB: leerLinea("lreb"), AST: leerLinea("last"), "3PM": leerLinea("l3pm") };

  if (!nombreIn && !playerSel) return setStatus("Escribe el nombre de un jugador.", "err");
  if (!temporada || temporada < 1947) return setStatus("Indica una temporada válida (ej: 2026).", "err");
  if (!n || n < 1) return setStatus("Indica cuántos partidos analizar.", "err");
  guardarForm();

  const btn = $("btn");
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Buscando…';
  $("results").classList.add("hidden"); $("tabs").classList.add("hidden");
  try {
    let jug = playerSel;
    if (!jug) {
      setStatus("Cargando jugadores NBA…");
      if (!IDX) IDX = await cargarIndice();
      poblarDatalist();
      const c = buscarCandidatos(IDX, nombreIn);
      if (!c.length) throw new Error("No se encontró '" + esc(nombreIn) + "' en los rosters actuales de la NBA.");
      if (c.length > 1) {
        const lista = c.slice(0, 12);
        $("status").innerHTML = '<div class="msg info">Varios resultados, elige uno:<div class="chips">' +
          lista.map((p, i) => '<button class="chip" data-i="' + i + '">' + esc(p.nombre) + " · " + esc(p.equipo) + "</button>").join("") + "</div></div>";
        $("status").querySelectorAll(".chip").forEach(b => b.onclick = () => analizar(lista[+b.dataset.i]));
        return;
      }
      jug = c[0];
    }
    setStatus("Descargando partidos de " + esc(jug.nombre) + "…");
    const data = await getJSON(GAMELOG + jug.id + "/gamelog", { season: temporada });
    const todas = parseGamelog(data, temporada);
    if (!todas.length) throw new Error("Sin partidos en el historial para la temporada " + temporada + ".");
    const filas = filtrarYRecortar(todas, filtro, n);
    if (!filas.length) throw new Error("Sin partidos que cumplan el filtro " + filtro + " en " + temporada + ".");
    const res = evaluar(filas, lineas);
    ESTADO = { jug, temporada, filtro, lineas, filas, res };
    setStatus("");
    render();
    $("formCard").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) {
    const m = String(e.message || e);
    setStatus("ERROR: " + esc(m) + '<br><button class="chip" id="diag" style="margin-top:10px">🔧 Probar conexión</button><div id="diagOut" style="margin-top:8px;font-size:12px;color:var(--mut)"></div>', "err");
    const dg = $("diag"); if (dg) dg.onclick = diagnostico;
  } finally {
    btn.disabled = false; btn.textContent = "Analizar";
  }
}

async function diagnostico() {
  const out = $("diagOut"); out.innerHTML = "Probando…";
  const test = BASE + "/teams";
  const RUTAS = armarRutas();
  let html = workerURL() ? "" : "⚠️ No hay Worker configurado (abre ⚙️ Conexión).<br>";
  for (let i = 0; i < RUTAS.length; i++) {
    try {
      const r = await fetch(RUTAS[i].f(test));
      const t = await r.text();
      html += (r.ok ? "✅ " : "❌ ") + RUTAS[i].n + " → HTTP " + r.status + " (" + t.length + " bytes)<br>";
    } catch (e) {
      html += "❌ " + RUTAS[i].n + " → " + esc(String(e.message || e)) + "<br>";
    }
    out.innerHTML = html + "…";
  }
  out.innerHTML = html + "<br>Versión de la app: v3";
}

  <div class="leg"><span style="color:${C.PTS}">● PTS ${res.pts}</span><span style="color:${C.REB}">● REB ${res.reb}</span><span style="color:${C.AST}">● AST ${res.ast}</span></div></div>
 <div class="card"><div class="sec" style="margin-top:0">Proyección vs promedio real (${st.n} partidos)</div><div class="grid3">${tile("PTS","Puntos")}${tile("REB","Rebotes")}${tile("AST","Asist.")}</div>
  <div class="leg" style="margin-top:8px"><span>▬ gris: promedio real</span><span>▬ color: proyección</span></div>
  <div style="margin-top:10px">${lv("Minutos reales (promedio)",st.min_prom)}${bar(st.min_prom,0,45,null,"#52607f")}${lv("Minutos proyectados",min)}${bar(min,0,45,null,"var(--acc)")}</div></div>
 <div class="card"><div class="sec" style="margin-top:0">Descanso y fatiga</div><div class="seg4">${seg.map((x,i)=>`<div class="${i===res.seg?"on":""}">${x[0]}<b>${x[2]}</b>${x[1]}</div>`).join("")}</div>
  ${lv("Último partido registrado",last||"N/A")}${lv("Próximo partido",fecha||"–")}${lv("Días de descanso",dias)}<div style="margin-top:6px;font-weight:700">${res.desc}</div></div>
 <div class="card"><div class="sec" style="margin-top:0">Ritmo del partido (Pace)</div>
  ${lv(esc(team)+" ("+mB+")",pT)}${bar(pT,a,b,AVG_PACE,"#38bdf8")}${lv(esc(rival)+" (rival "+mR+")",pR)}${bar(pR,a,b,AVG_PACE,"#a78bfa")}${lv("Combinado",res.pp)}${bar(res.pp,a,b,AVG_PACE,"var(--acc)")}
  <div class="leg"><span>| línea blanca = media liga ${AVG_PACE}</span></div></div>
 <div class="card"><div class="sec" style="margin-top:0">Defensa del rival (DefRtg)</div>${lv(esc(rival)+" ("+mR+")",dR)}${bar(dR,AVG_DEF-12,AVG_DEF+12,AVG_DEF,fav?"var(--ok)":"var(--bad)")}
  <div class="leg"><span>| media liga ${AVG_DEF}</span><b style="color:${fav?"var(--ok)":"var(--bad)"}">${fav?"Favorable":"Difícil"} (${dd>0?"+":""}${r(dd,1)})</b></div></div>
 <div class="card"><div class="sec" style="margin-top:0">Tiros proyectados</div><div class="ring">
  <svg width="120" height="120" viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--card2)" stroke-width="12"/><circle cx="60" cy="60" r="48" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C2*res.fgp/100} ${C2}" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="var(--txt)" font-size="22" font-weight="800">${res.fgp}%</text></svg>
  <div style="flex:1">${lv("Tiros (FGA)",res.fga)}${lv("Efectividad ajustada",res.fgp+"%")}${lv("Efectividad base",r(st.fg_pct*100,1)+"%")}</div></div></div>
 <div class="foot">Proyección estimada con el modelo del Colab; no garantiza resultados.</div>`;
 $("effOut").scrollIntoView({behavior:"smooth",block:"start"});}
function elegir(el,lista,cb){el.innerHTML='<div class="msg info">Varios resultados, elige uno:<div class="chips">'+lista.map((p,i)=>`<button class="chip" data-i="${i}">${esc(p.nombre)} · ${esc(p.equipo)}</button>`).join("")+"</div></div>";el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>cb(lista[+b.dataset.i]));}
async function analizarEff(sel){const nom=$("ejug").value.trim(),temp=parseInt($("etemp").value,10),cond=$("econd").value,rival=$("erival").value,fecha=$("efecha").value,min=+$("emin").value,tsel=$("eteam").value,S=$("effStatus");
 const err=m=>{S.innerHTML='<div class="msg err">'+m+"</div>";};
 if(!nom&&!sel)return err("Escribe el nombre de un jugador.");if(!temp)return err("Indica una temporada válida (ej: 2027).");if(!rival)return err("Elige el equipo rival.");
 try{localStorage.setItem("nba_eff_v1",JSON.stringify({j:nom,t:tsel,r:rival,c:cond,y:temp,m:min}));}catch(e){}
 const b=$("ebtn");b.disabled=true;b.innerHTML='<span class="spin"></span>Calculando…';$("effOut").innerHTML="";
 try{let j=sel;
  if(!j){S.innerHTML='<div class="msg info">Cargando jugadores NBA…</div>';if(!IDX)IDX=await cargarIndice();poblarDatalist();const c=buscarCandidatos(IDX,nom);
   if(!c.length)throw new Error("No se encontró '"+esc(nom)+"' en los rosters actuales de la NBA.");if(c.length>1){elegir(S,c.slice(0,12),analizarEff);return;}j=c[0];}
  S.innerHTML='<div class="msg info">Descargando partidos de '+esc(j.nombre)+"…</div>";
  const P=parseEff(await getJSON(GAMELOG+j.id+"/gamelog",{season:temp})),st=P.rows.length?statsEff(P,cond):null;
  if(!st)throw new Error("Sin partidos con minutos para la temporada "+temp+". Prueba con otra temporada.");
  let pos=j.pos?posEs(j.pos):"N/A";if(pos==="N/A"){try{const p=((await getJSON(GAMELOG+j.id)).athlete||{}).position||{};pos=posEs(p.displayName||p.abbreviation||p.name);}catch(e){}}
  const team=tsel!=="AUTO"?tsel:(j.ab?fixAb(j.ab):(P.eq?fixAb(P.eq):null)),dias=fecha&&P.last?Math.max(0,Math.round((Date.parse(fecha)-Date.parse(P.last))/864e5)):2,
   mB=cond==="VISITANTE"?"VISITANTE":"LOCAL",mR=cond==="LOCAL"?"VISITANTE":"LOCAL",
   pT=(PACE[team]||{})[mB]||AVG_PACE,pR=(PACE[rival]||{})[mR]||AVG_PACE,dR=(DEFR[rival]||{})[mR]||AVG_DEF;
  S.innerHTML=team?"":'<div class="msg info">No pude detectar el equipo del jugador: elígelo en "Equipo del jugador" para usar su ritmo real.</div>';
  renderEff({nom:j.nombre,pos,team:team||"N/D",rival,cond,mB,mR,min,temp,st,res:proyectar(min,st,pT,pR,dR,dias),pT,pR,dR,dias,last:P.last,fecha});
 }catch(e){err(esc(String(e.message||e)));}finally{b.disabled=false;b.textContent="Calcular eficiencia";}}
function verVista(v){$("viewLineas").classList.toggle("hidden",v!=="l");$("viewEff").classList.toggle("hidden",v!=="e");document.querySelectorAll(".toptab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));try{localStorage.setItem("nba_view",v);}catch(e){}window.scrollTo(0,0);}
(function(){document.querySelectorAll(".toptab").forEach(t=>t.onclick=()=>verVista(t.dataset.v));
 $("eteam").innerHTML='<option value="AUTO">Automático</option>'+EQ.map(x=>`<option value="${x[0]}">${x[0]} – ${x[1]}</option>`).join("");
 $("erival").innerHTML='<option value="">Elige rival…</option>'+EQ.map(x=>`<option value="${x[0]}">${x[0]} – ${x[1]}</option>`).join("");
 const h=new Date(),m=new Date(h.getTime()+864e5);$("efecha").value=m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0");
 $("etemp").value=h.getMonth()>=9?h.getFullYear()+1:h.getFullYear();
 try{const d=JSON.parse(localStorage.getItem("nba_eff_v1")||"null");if(d){$("ejug").value=d.j||"";$("eteam").value=d.t||"AUTO";$("erival").value=d.r||"";$("econd").value=d.c||"LOCAL";if(d.y)$("etemp").value=d.y;if(d.m)$("emin").value=d.m;}}catch(e){}
 const ay=()=>{const t=parseInt($("etemp").value,10);$("etempHelp").textContent=t?"Temporada NBA "+(t-1)+"-"+t:"";$("eminv").textContent=$("emin").value;};
 $("etemp").addEventListener("input",ay);$("emin").addEventListener("input",ay);ay();
 $("ebtn").onclick=()=>analizarEff();$("ejug").addEventListener("keydown",e=>{if(e.key==="Enter")analizarEff();});
 try{if(localStorage.getItem("nba_view")==="e")verVista("e");}catch(e){}})();
</script>
